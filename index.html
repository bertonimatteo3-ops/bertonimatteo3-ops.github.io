<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #001a1a, #000);
  color: white;
  text-align: center;
}

/* HERO */
.hero {
  padding: 80px 20px 40px;
}

h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

.highlight {
  color: #2ecc71;
}

p.subtitle {
  color: #aaa;
  margin-bottom: 30px;
}

button {
  background: #2ecc71;
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.profile {
  margin-top: 30px;
}

.profile img {
  width: 160px;
  border-radius: 50%;
  border: 3px solid #2ecc71;
}

/* LOGHI */
.logos-wrapper {
  overflow: hidden;
  margin-top: 60px;
  position: relative;
}

/* fade laterale */
.logos-wrapper::before,
.logos-wrapper::after {
  content: "";
  position: absolute;
  top: 0;
  width: 120px;
  height: 100%;
  z-index: 2;
}

.logos-wrapper::before {
  left: 0;
  background: linear-gradient(to right, #000, transparent);
}

.logos-wrapper::after {
  right: 0;
  background: linear-gradient(to left, #000, transparent);
}

.logos-track {
  display: flex;
  gap: 50px;
  width: max-content;
  animation: scroll 30s linear infinite;
}

.logos-track:hover {
  animation-play-state: paused;
}

.logos-track img {
  height: 60px;
  max-width: 140px;
  object-fit: contain;

  background: white;
  padding: 12px;
  border-radius: 12px;

  transition: 0.3s;
}

.logos-track img:hover {
  transform: scale(1.1);
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
</style>
</head>

<body>
