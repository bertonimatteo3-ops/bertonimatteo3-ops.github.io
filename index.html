<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matteo Bertoni</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #001f3f);
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-top: 60px;
    }

    h1 span {
      color: #2ecc71;
    }

    p {
      color: #aaa;
      margin-top: 10px;
    }

    .btn {
      margin-top: 25px;
      padding: 14px 28px;
      background: #2ecc71;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      display: inline-block;
      text-decoration: none;
    }

    .profile {
      margin-top: 40px;
    }

    .profile img {
      width: 150px;
      border-radius: 50%;
      border: 3px solid #2ecc71;
    }

    /* LOGHI */
    .logos-section {
      margin-top: 80px;
      overflow: hidden;
    }

    .logos-title {
      color: #ccc;
      margin-bottom: 30px;
    }

    .logos-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .logos-track {
      display: flex;
      gap: 40px;
      width: max-content;
      animation: scroll 30s linear infinite;
    }

    .logos-track img {
      height: 50px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      object-fit: contain;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
  </style>
</head>

<body>
